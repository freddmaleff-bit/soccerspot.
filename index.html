  <style>
:root{--forest:#101c19;--dark:#13251f;--forest2:#233e32;--green:#237a4e;--lime:#baf864;--lime2:#d7ffa4;--bg:#f4f6f2;--ink:#182520;--muted:#6a7871;--border:#e0e7de;--white:#fff;--rose:#f4e9df;--shadow:0 12px 35px rgba(23,43,29,.07);font-family:'DM Sans',system-ui,sans-serif;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);min-width:320px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:inherit}h1,h2,h3,p{margin-top:0}h1,h2,h3,.brand,.stat-num{font-family:'Outfit',sans-serif}h1{font-weight:800}svg{flex-shrink:0}.icon{width:19px;height:19px;vertical-align:middle}.icon.sm{width:16px;height:16px}.icon.lg{width:22px;height:22px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #86dca3;outline-offset:2px}
.site-header{height:78px;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1340px)/2));gap:14px;position:relative;z-index:9;border-bottom:1px solid #ffffff13}.brand-wrap{display:flex;align-items:center;gap:12px;min-width:0}.brand-icon{width:43px;height:43px;border-radius:14px;background:var(--lime);display:grid;place-items:center;color:#14251c;box-shadow:0 4px 12px #0002}.brand-icon svg{width:28px;height:28px}.brand{font-size:25px;font-weight:900;letter-spacing:-1.1px;line-height:1}.brand strong{color:var(--lime)}.brand-tag{font-size:10px;letter-spacing:1.3px;color:#9daf9f;font-weight:700;display:block;margin-top:4px}.header-links{display:flex;align-items:center;gap:8px}.header-link{display:flex;align-items:center;gap:8px;background:transparent;color:#d9e7de;border:0;padding:12px 15px;border-radius:12px;font-weight:700;font-size:13px}.header-link.active,.header-link:hover{background:#ffffff13;color:var(--lime)}.header-link.cta{background:var(--lime);color:var(--dark);margin-left:10px}.header-link.cta:hover{background:#dbffab}
.shell{max-width:1340px;margin:0 auto;padding:24px 24px 90px}.page-eyebrow{font-weight:800;letter-spacing:2px;font-size:11px;text-transform:uppercase;color:var(--green)}.hero{border-radius:24px;background:var(--forest);color:#fff;min-height:248px;overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr;position:relative;isolation:isolate}.hero:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 68% 95% at 96% 35%,#47825940,transparent 67%),linear-gradient(115deg,transparent 50%,#2a4c332d);pointer-events:none}.hero-copy{padding:30px 36px 28px;position:relative;z-index:1}.hero-label{display:inline-flex;align-items:center;gap:7px;border:1px solid #baf86445;background:#baf86416;color:var(--lime);font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:8px 11px;border-radius:100px}.hero h1{font-size:clamp(32px,4vw,54px);line-height:1.03;letter-spacing:-1.6px;margin:16px 0 10px;max-width:650px}.hero h1 em{font-style:normal;color:var(--lime)}.hero p{color:#b4c6bd;font-size:14px;line-height:1.7;margin-bottom:0;max-width:490px}.hero-art{position:relative;min-height:220px;overflow:hidden;display:grid;place-items:center}.hero-rings{width:460px;height:330px;border-radius:50%;background:repeating-radial-gradient(ellipse at center,transparent 0,transparent 43px,#baf86410 44px,#baf86410 46px,transparent 47px,transparent 69px);position:absolute;transform:rotate(-17deg)}.pitch{width:76%;max-width:390px;aspect-ratio:1.75;transform:rotate(-21deg) skew(-5deg);position:relative;border:4px solid #baf86495;border-radius:4px;background:repeating-linear-gradient(90deg,#397850 0 38px,#336d4a 38px 76px);box-shadow:12px 17px 0 #111a1760,25px 42px 60px #0006}.pitch:after{content:'';position:absolute;inset:8px;border:2px solid #eaffd080}.pitch-mid{position:absolute;left:50%;top:8px;bottom:8px;border-left:2px solid #eaffd0a8;z-index:1}.pitch-circle{position:absolute;width:28%;aspect-ratio:1;border:2px solid #eaffd0a8;border-radius:50%;left:36%;top:19%;z-index:1}.pitch-goal{position:absolute;top:29%;height:42%;width:17%;border:2px solid #eaffd0a8;z-index:1}.pitch-goal.left{left:8px;border-left:0}.pitch-goal.right{right:8px;border-right:0}.hero-ball{position:absolute;left:57%;top:29%;height:45px;width:45px;display:grid;place-items:center;border-radius:50%;background:var(--lime);box-shadow:0 5px 18px #0005;color:#16391f;transform:rotate(21deg);z-index:3}.hero-ball svg{width:25px;height:25px}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0 22px}.stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:15px 18px;display:flex;align-items:center;gap:12px}.stat-dot{width:39px;height:39px;display:grid;place-items:center;background:#eef8e8;color:#327a4f;border-radius:12px}.stat-num{font-size:23px;font-weight:800;line-height:1}.stat-desc{font-size:11px;color:var(--muted);margin-top:2px}
.layout{display:grid;grid-template-columns:256px minmax(0,1fr);gap:22px;align-items:start}.filter-panel{border-radius:20px;background:white;border:1px solid var(--border);padding:21px;position:sticky;top:18px;box-shadow:var(--shadow)}.panel-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.panel-heading strong{font-family:Outfit;font-size:18px}.subtle-btn{font-size:11px;font-weight:700;color:var(--green);background:none;border:none;padding:5px}.field-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#617368;margin-bottom:9px;display:block}.filter-block{margin-top:18px;padding-top:18px;border-top:1px solid #e8eee8}.filter-block:first-of-type{border:0;padding-top:0}.select-control,.search-control,.input,.textarea{background:#f7f9f5;border:1px solid #e2e9e0;border-radius:12px;color:var(--ink);width:100%;min-height:43px;padding:10px 13px;outline:none}.select-control:focus,.search-control:focus,.input:focus,.textarea:focus{border-color:#6aaa78;box-shadow:0 0 0 3px #7ac8852e}.check-row{display:flex;align-items:center;gap:10px;margin:13px 0;color:#53635a;font-size:13px;font-weight:600}.check-row input{width:17px;height:17px;accent-color:#2a8759}.filter-tip{background:#f0f8e9;padding:12px 14px;border-radius:12px;margin-top:20px;font-size:11px;color:#536b4f;line-height:1.5}.filter-tip svg{color:#398c56}.main-content{min-width:0}.explore-heading{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 0 17px}.explore-heading h2{font-size:24px;letter-spacing:-.5px;margin:0}.explore-heading p{font-size:12px;color:var(--muted);margin:5px 0 0}.searchbar{display:flex;gap:10px;margin-bottom:14px}.search-wrap{position:relative;flex:1}.search-wrap .icon{position:absolute;left:16px;top:15px;color:#85948b}.search-control{padding-left:44px;background:#fff;height:49px}.geo-btn,.view-btn,.pill,.small-btn,.primary-btn,.outline-btn{border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:750;white-space:nowrap}.geo-btn{padding:0 15px;font-size:12px}.geo-btn:hover,.view-btn:hover{border-color:#92cbb0}.chips{display:flex;align-items:center;gap:8px;overflow:auto;padding:2px 0 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.pill{font-size:12px;padding:9px 12px;border-radius:99px;flex-shrink:0;color:#5b6e62}.pill.active{background:var(--forest2);border-color:var(--forest2);color:#fff}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.toolbar-label{font-size:12px;color:var(--muted)}.toolbar-label strong{color:#243a2b}.segmented{display:flex;background:#e7ece6;border-radius:12px;padding:3px;gap:3px}.view-btn{background:transparent;border:0;padding:8px 13px;font-size:11px;border-radius:9px;color:#64756a}.view-btn.active{background:#fff;color:#1f4230;box-shadow:0 2px 6px #0000000b}
.card-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field-card{border:1px solid var(--border);background:#fff;border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s}.field-card:hover{transform:translateY(-3px);border-color:#a6d8aa;box-shadow:0 15px 36px #12352012}.photo-placeholder{background:#e8f0e4;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#44624a;min-height:152px}.field-card .photo-placeholder{height:148px}.photo-placeholder:before{content:'';width:80%;height:78%;position:absolute;opacity:.33;transform:rotate(-16deg);background:repeating-linear-gradient(90deg,#48875a 0 30px,#76ae7a 30px 60px);border:3px solid white;border-radius:3px}.mini-field{position:absolute;width:67%;height:58%;border:2px solid #ffffffc9;transform:rotate(-16deg)}.mini-field:before{content:'';position:absolute;left:50%;height:100%;border-left:2px solid #ffffffbd}.mini-field:after{content:'';position:absolute;width:24%;aspect-ratio:1;border:2px solid #ffffffc9;border-radius:50%;left:38%;top:19%}.placeholder-label{position:relative;z-index:1;color:#fff;font-size:11px;font-weight:800;background:#1a3026b8;padding:9px 12px;border-radius:100px;backdrop-filter:blur(2px)}.field-card .kind-pill{position:absolute;z-index:2;top:11px;left:12px;color:#fff;background:#123e30db;padding:6px 9px;font-size:10px;border-radius:7px;font-weight:800}.heart{background:white;border:1px solid #e5ede5;border-radius:50%;height:34px;width:34px;display:grid;place-items:center;color:#4b5b50}.field-card>.image-box>.heart{position:absolute;right:12px;top:10px;z-index:3}.heart.saved{color:#d45556;background:#fff3f3;border-color:#f2bbbb}.image-box{position:relative}.field-card-content{padding:15px}.card-city{display:flex;align-items:center;gap:5px;color:#438457;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.65px}.card-title{margin:7px 0 5px;font-size:19px;letter-spacin let favorites=read('favorites',[]), reviews=read('reviews',{}), submissions=read('submissions',[]), photos=read('photos',{});
const S={page:'explorer',dialogId:null,search:'',city:'',kind:'',surface:'',cost:'',format:'',access:false,confirmed:false,onlyFav:false,view:'liste',sort:'pertinence',geo:null,filtersOpen:false,reviewStars:0,map:null,mapLayer:null,mapReady:false,localFilter:'tout'};

function isSaved(id){return favorites.includes(id)}
function toggleFavorite(id){favorites=isSaved(id)?favorites.filter(x=>x!==id):[...favorites,id];store('favorites',favorites);toast(isSaved(id)?'Ajouté à tes favoris':'Retiré des favoris');render()}
const norm=(s)=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
function filtered(){let a=places.filter(p=>{
 if(S.page==='favoris'&&!isSaved(p.id))return false;
 if(S.onlyFav&&!isSaved(p.id))return false;
 if(S.search){const words=norm([p.name,p.city,p.address,p.surface.join(' '),p.notes].join(' ')).split(' ');const queries=norm(S.search).split(' ').filter(Boolean);if(!queries.every(q=>words.some(w=>w.startsWith(q))))return false;}
 if(S.city&&p.city!==S.city)return false;
 if(S.kind&&p.kind!==S.kind)return false;
 if(S.surface&&!p.surface.includes(S.surface))return false;
 if(S.cost&&p.price!==S.cost)return false;
 if(S.format&&!p.formats.includes(S.format))return false;
 if(S.access&&p.access!=='plages')return false; // seul créneau officiellement confirmé pour entraînement familial
 if(S.confirmed&&p.verified.length<3)return false;
 return true});
 if(S.geo&&S.sort==='distance')a.sort((x,y)=>{const dx=x.lat===null?Infinity:distanceKm(S.geo.lat,S.geo.lng,x.lat,x.lng);const dy=y.lat===null?Infinity:distanceKm(S.geo.lat,S.geo.lng,y.lat,y.lng);return dx-dy});
 if(S.sort==='az')a.sort((x,y)=>x.name.localeCompare(y.name,'fr-CA'));
 return a;}

function filterContents(){return `<div class="panel-heading"><strong>Filtres</strong><button class="subtle-btn" data-action="reset">Réinitialiser</button></div>

<div class="filter-block"><label class="field-label" for="filter-cost">Tarif vérifié</label><select id="filter-cost" class="select-control" data-filter="cost"><option value="">Tous les tarifs</option><option value="gratuit" ${S.cost==='gratuit'?'selected':''}>Gratuit confirmé</option><option value="payant" ${S.cost==='payant'?'selected':''}>Payant confirmé</option></select></div>
<div class="filter-block"><label class="field-label" for="filter-format">Format</label><select id="filter-format" class="select-control" data-filter="format"><option value="">Tous les formats</option>${['4','7','11'].map(f=>`<option value="${f}" ${S.format===f?'selected':''}>Soccer à ${f}</option>`).join('')}</select></div>

<div class="filter-tip">${I('info','sm')} <b>Important :</b> « Non confirmé » ne veut pas dire « non disponible ». Les horaires d'ouverture des parcs ne garantissent pas que leurs terrains soient libres.</div>`}

function placeholder(p,full=false){const photo=photos[p.id];return `<div class="photo-placeholder ${full?'dialog-image':''}">${photo?`<img class="photo-local" src="${photo.data}" alt="Photo ajoutée par l'utilisateur, non vérifiée"> <span class="local-badge">${I('camera','sm')} Photo locale non vérifiée</span>`:`<div class="mini-field" aria-hidden="true"></div><span class="placeholder-label">${I('camera','sm')} Photo du terrain à ajouter</span>`}</div>`}
function tags(p){let a=[];if(p.surface.length)a.push(`<span class="tag">${I('layers','sm')} ${p.surface.map(x=>x==='synthétique'?'Synthétique':'Naturel').join(' + ')}</span>`);else a.push('<span class="tag unknown">Surface à confirmer</span>');if(p.price==='gratuit')a.push('<span class="tag lime">Gratuit ✓</span>');else if(p.price==='payant')a.push('<span class="tag red">Payant</span>');if(p.access==='plages')a.push('<span class="tag lime">Zone familiale ✓</span>');else if(p.access==='non')a.push('<span class="tag red">Entraînement interdit</span>');if(p.formats.length)a.push(`<span class="tag">${p.formats.map(f=>f+'v'+f).join(' / ')}</span>`);return a.join('')}
function card(p){const c=p.city;return `<article class="field-card" data-open="${p.id}" tabindex="0" role="button" aria-label="Voir la fiche de ${escapeHTML(p.name)}"><div class="image-box">${placeholder(p)}<span class="kind-pill">${p.kind?escapeHTML(p.kind.toUpperCase()):'À CONFIRMER'}</span><button class="heart ${isSaved(p.id)?'saved':''}" data-action="favorite" data-id="${p.id}" aria-label="${isSaved(p.id)?'Retirer des':'Ajouter aux'} favoris">${I('heart','sm')}</button></div><div class="field-card-content"><span class="card-city">${I('pin','sm')} ${escapeHTML(c)}</span><h3 class="card-title">${escapeHTML(p.name)}</h3><div class="card-address">${escapeHTML(p.address)}</div><div class="card-tags">${tags(p)}</div><div class="card-foot"><span class="source-mini">${I('shield','sm')} Source : ${escapeHTML(p.sourceName)}</span><span class="open-arrow">${I('arrow','sm')}</span></div></div></article>`}

function pDetail(p){const rv=reviews[p.id]||[];const dist=S.geo&&p.lat!==null?distanceKm(S.geo.lat,S.geo.lng,p.lat,p.lng).toFixed(1)+' km de toi':null;return `<div class="dialog-backdrop" data-action="dismiss"><div class="dialog" role="dialog" aria-modal="true" aria-label="Fiche ${escapeHTML(p.name)}"><button class="dialog-close" data-action="close" aria-label="Fermer la fiche">${I('close')}</button>${placeholder(p,true)}<div class="dialog-body"><span class="card-city">${I('pin','sm')} ${escapeHTML(p.city)}${dist?' · '+dist:''}</span><h2 class="dialog-title">${escapeHTML(p.name)}</h2><div class="dialog-address">${I('pin','sm')} ${escapeHTML(p.address)}</div><div class="details-tags">${tags(p)}<span class="tag ${p.lat===null?'gold':'lime'}">${I('map','sm')} ${p.lat!==null?'Localisé sur la carte':'Position exacte à confirmer'}</span></div><div class="dialog-actions"><a class="primary-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.address)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">${I('nav','sm')} Itinéraire</a><button data-action="favorite" data-id="${p.id}" class="outline-btn">${I('heart','sm')} ${isSaved(p.id)?'Retirer des favoris':'Ajouter aux favoris'}</button><a class="outline-btn" href="${p.source}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">${I('external','sm')} Source officielle</a></div>
<div class="notice ${p.access==='non'?'warning':''}">${I('info','sm')} ${escapeHTML(p.notes)}</div>
<h3 class="section-title">Caractéristiques du terrain</h3><div class="spec-grid">${spec('Type',p.kind,known(p,'kind'))}${spec('Surface',p.surface.length?p.surface.join(' + '):null,known(p,'surface'))}${spec('Format',p.formats.length?p.formats.map(f=>f+' contre '+f).join(', '):null,known(p,'formats'))}${spec('Tarif',p.price==='gratuit'?'Gratuit':p.price==='payant'?'Payant':null,known(p,'price'))}${spec('Pratique libre',p.access==='plages'?'Oui, selon les plages annoncées':p.access==='non'?'Entraînement individuel interdit':null,known(p,'access'))}${spec('Éclairage',p.lighting===null?null:p.lighting?'Oui':'Non',known(p,'lighting'))}${spec('Buts',p.goals===null?null:p.goals?'Présents':'Non',known(p,'goals'))}${spec('Toilettes',p.restrooms===null?null:p.restrooms?'Oui (parfois saisonnières)':'Non',known(p,'restrooms'))}${spec('Stationnement',p.parking===null?null:p.parking?'Oui':'Non',known(p,'parking'))}${spec('Position GPS',p.lat!==null?'Repère sur la carte':null,p.lat!==null)}</div>
${p.hours?`<h3 class="section-title">Horaires / périodes annoncées</h3><div class="notice">${I('clock','sm')} ${escapeHTML(p.hours)}<br><b>Attention :</b> l'horaire d'un parc ou d'un centre ne signifie pas qu'un terrain est disponible en tout temps.</div>`:''}
<div class="source-card"><div>${I('shield','sm')} <b>Origine des informations</b><br><a href="${p.source}" target="_blank" rel="noopener noreferrer">${escapeHTML(p.sourceName)} ${I('external','sm')}</a><small>Source consultée le ${UPDATED}. Chaque donnée inconnue est indiquée séparément.</small></div></div>
<h3 class="section-title">Photos de ce terrain</h3><div class="notice">${I('camera','sm')} Aucune photo publique du terrain n'a été ajoutée à cette première version. Tu peux ajouter une photo personnelle ci-dessous; elle restera uniquement sur cet appareil et sera indiquée comme non vérifiée.</div><div class="form-row"><label for="photo-${p.id}" class="outline-btn" style="cursor:pointer">${I('camera','sm')} ${photos[p.id]?'Remplacer ma photo':'Ajouter ma photo'} (local)</label><input id="photo-${p.id}" type="file" accept="image/png,image/jpeg,image/webp" data-photo="${p.id}" style="position:absolute;left:-10000px" aria-label="Importer une photo personnelle"><p class="form-help">JPG, PNG ou WebP, jusqu'à 1 Mo. Ne partage pas de photo sans les droits nécessaires.</p>${photos[p.id]?`<button class="small-btn" data-action="delete-photo" data-id="${p.id}">${I('trash','sm')} Effacer ma photo</button>`:''}</div>
<h3 class="section-title">Tes évaluations ${rv.length?'('+rv.length+' locale'+(rv.length>1?'s':'')+')':''}</h3><p style="font-size:12px;color:var(--muted)">Notes enregistrées <b>sur cet appareil seulement</b>. Elles ne sont pas des avis publics et n'influencent pas le classement des autres.</p>${rv.length?`<div class="review-list">${rv.map(r=>`<div class="review"><strong>${escapeHTML(r.author||'Moi')}</strong> <small>${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</small><p>${escapeHTML(r.text)}</p><button data-action="delete-review" data-id="${r.id}" data-place="${p.id}">Supprimer</button></div>`).join('')}</div>`:''}
<form id="review-form" data-id="${p.id}"><div class="form-row"><label>Ma note</label><div class="stars" role="group" aria-label="Note sur cinq">${[1,2,3,4,5].map(n=>`<button type="button" data-action="star" data-value="${n}" class="star-btn ${n<=S.reviewStars?'selected':''}" aria-label="${n} étoile${n>1?'s':''}" aria-pressed="${n===S.reviewStars}">★</button>`).join('')}</div></div><div class="form-row"><label for="review-text">Mon commentaire</label><textarea class="textarea" id="review-text" name="text" maxlength="400" required placeholder="Qualité du gazon, équipements, impression générale..." style="min-height:74px"></textarea></div><button class="primary-btn" type="submit">${I('star','sm')} Enregistrer ma note locale</button></form></div></div></div>`}
function drawer(){return `<div class="filter-drawer ${S.filtersOpen?'open':''}" data-action="drawer-dismiss"><div class="filter-drawer-inner"><div class="drawer-handle"></div>${filterContents()}<button data-action="filters-close" class="primary-btn drawer-btn">Voir ${filtered().length} résultat${filtered().length!==1?'s':''} ${I('arrow','sm')}</button></div></div>`}
function render(){document.title=`${S.page==='explorer'?'Explorer':S.page==='favoris'?'Favoris':S.page==='contribuer'?'Contribuer':'Installer'} · SOCCERSPOT`;const pages={explorer:explorePage,favoris:favPage,contribuer:contributePage,installer:installPage};node.innerHTML=header()+`<main class="shell" id="main">${(pages[S.page]||explorePage)()}${footer()}</main>`+bottomNav()+drawer()+(S.dialogId?pDetail(places.find(x=>x.id===S.dialogId)||places[0]):'');document.body.style.overflow=S.dialogId||S.filtersOpen?'hidden':'';if(S.page==='explorer'&&S.view==='carte')showMap();if(S.page==='installer')showInstallPrompt();}
function resetFilters(){S.search='';S.city='';S.surface='';S.kind='';S.cost='';S.format='';S.access=false;S.confirmed=false;S.onlyFav=false;S.sort='pertinence';render()}
function openPlace(id){if(!places.find(p=>p.id===id))return;S.dialogId=id;S.reviewStars=0;location.hash='terrain/'+id;render()}
function closePlace(){S.dialogId=null;location.hash=S.page||'explorer';render()}
function route(){let h=decodeURIComponent(location.hash.slice(1)||'explorer');if(h.startsWith('terrain/')){const id=h.slice('terrain/'.length);S.dialogId=places.some(p=>p.id===id)?id:null;S.filtersOpen=false;if(!['explorer','favoris'].includes(S.page))S.page='explorer';}else {S.dialogId=null;S.filtersOpen=false;S.page=['explorer','favoris','contribuer','installer'].includes(h)?h:'explorer';window.scrollTo(0,0)}render()}
function geolocate(){if(!navigator.geolocation){toast('Géolocalisation non offerte sur ce navigateur.');return}toast('Recherche de ta position…');navigator.geolocation.getCurrentPosition(pos=>{S.geo={lat:pos.coords.latitude,lng:pos.coords.longitude};S.sort='distance';toast('Terrains triés par proximité lorsque localisés.');render()},()=>toast('Position non obtenue. Autorise la localisation dans ton navigateur.'),{enableHighAccuracy:false,timeout:12000,maximumAge:60000})}
let leafletLoading=null;function loadLeaflet(){if(window.L)return Promise.resolve(window.L);if(leafletLoading)return leafletLoading;leafletLoading=new Promise((resolve,reject)=>{let css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);let s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=()=>resolve(window.L);s.onerror=()=>reject(new Error('Carte indisponible'));document.head.appendChild(s)});return leafletLoading}
async function showMap(){let el=document.querySelector('#map-canvas');if(!el)return;el.innerHTML='<div class="loading">Chargement de la carte…</div>';try{const L=await loadLeaflet();el=document.querySelector('#map-canvas');if(!el)return;el.innerHTML='';const map=L.map(el,{scrollWheelZoom:false});S.map=map;map.setView([45.73,-73.88],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributeurs'}).addTo(map);const pts=filtered().filter(p=>p.lat!==null&&p.lng!==null);const markers=[];for(const p of pts){const icon=L.divIcon({html:`<div class="pin">${I('ball')}</div>`,className:'',iconSize:[36,40],iconAnchor:[18,37]});const m=L.marker([p.lat,p.lng],{icon}).addTo(map);m.bindPopup(`<span class="pop-title">${escapeHTML(p.name)}</span><span class="pop-city">${escapeHTML(p.city)} · ${escapeHTML(p.surface.join(', ')||'Surface inconnue')}</span><button class="pop-btn" data-open="${p.id}">Voir la fiche ${I('arrow','sm')}</button>`);markers.push(m)}if(markers.length>0){const grp=L.featureGroup(markers);map.fitBounds(grp.getBounds().pad(.17),{maxZoom:12})}if(S.geo)L.circleMarker([S.geo.lat,S.geo.lng],{radius:8,color:'#1771d1',fillColor:'#2f95e7',fillOpacity:1}).addTo(map).bindPopup('Ta position approximative');setTimeout(()=>map.invalidateSize(),120)}catch(e){console.error(e);const div=document.querySelector('#map-canvas');if(div)div.innerHTML='<div class="loading">Carte indisponible sans connexion Internet.<br><br><button class="primary-btn" data-action="view" data-value="liste">Consulter la liste des terrains</button></div>'}}
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredPrompt=event;showInstallPrompt()});function showInstallPrompt(){const b=document.querySelector('#prompt-install');if(b&&deferredPrompt)b.style.display='inline-flex'}
function keepFocusRerender(){let e=document.activeElement;let id=e?.id;let start,end;try{start=e.selectionStart;end=e.selectionEnd}catch{}render();if(id){let x=document.getElementById(id);if(x){x.focus();if(start!==null&&start!==undefined)try{x.setSelectionRange(start,end)}catch{}}}}
document.body.addEventListener('input',e=>{if(e.target.id==='search-input'){S.search=e.target.value;keepFocusRerender()}});
document.body.addEventListener('change',async e=>{const k=e.target.dataset.filter;if(k){S[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;render();return}const id=e.target.dataset.photo;if(id){const f=e.target.files?.[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>1024*1024){toast('Utilise une photo JPG/PNG/WebP de 1 Mo maximum.');return}const reader=new FileReader();reader.onload=()=>{const newPhotos={...photos,[id]:{data:String(reader.result),date:new Date().toISOString()}};if(store('photos',newPhotos)){photos=newPhotos;toast('Photo enregistrée sur cet appareil.');render()}};reader.readAsDataURL(f)}});
document.body.addEventListener('click',async e=>{const t=e.target.closest('[data-action],[data-open]');if(!t)return;const a=t.dataset.action,id=t.dataset.id;if(t.dataset.open){e.preventDefault();openPlace(t.dataset.open);return}if(a==='favorite'){e.preventDefault();e.stopPropagation();toggleFavorite(id)}else if(a==='reset'){resetFilters()}else if(a==='reset-simple'){S.surface='';S.kind='';S.cost='';S.access=false;S.city='';S.format='';render()}else if(a==='chip'){const ty=t.dataset.type,vl=t.dataset.value;if(ty==='reset-simple'){resetFilters();return}else if(ty==='access')S.access=!S.access;else S[ty]=S[ty]===vl?'':vl;render()}else if(a==='view'){S.view=t.dataset.value;render()}else if(a==='geolocate'){geolocate()}else if(a==='filters'){S.filtersOpen=true;render()}else if(a==='filters-close'){S.filtersOpen=false;render()}else if(a==='drawer-dismiss'){if(e.target===t){S.filtersOpen=false;render()}}else if(a==='dismiss'){if(e.target===t)closePlace()}else if(a==='close'){closePlace()}else if(a==='star'){S.reviewStars=Number(t.dataset.value);const form=document.querySelector('#review-form');const val=form?.querySelector('#review-text')?.value;render();if(val){document.querySelector('#review-text').value=val}}else if(a==='delete-review'){reviews[t.dataset.place]=(reviews[t.dataset.place]||[]).filter(r=>r.id!==id);store('reviews',reviews);toast('Évaluation locale supprimée.');render()}else if(a==='delete-photo'){delete photos[id];store('photos',photos);toast('Photo locale effacée.');render()}else if(a==='remove-submission'){submissions=submissions.filter(s=>s.id!==id);store('submissions',submissions);render()}else if(a==='install'){if(deferredPrompt){await deferredPrompt.prompt();deferredPrompt=null}else toast('Ouvre le site public dans Chrome, puis menu ⋮ et Installer.') }});
document.body.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.dialogId)closePlace();else if(S.filtersOpen){S.filtersOpen=false;render()}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.field-card')){e.preventDefault();openPlace(e.target.dataset.open)}});
document.body.addEventListener('submit',e=>{if(e.target.id==='review-form'){e.preventDefault();const id=e.target.dataset.id;const content=new FormData(e.target).get('text')?.toString().trim();if(!S.reviewStars){toast('Choisis une note entre 1 et 5 étoiles.');return}if(!content){toast('Écris un petit commentaire.');return}reviews[id]=[...(reviews[id]||[]),{id:makeId(),author:'Moi',stars:S.reviewStars,text:content,date:new Date().toISOString()}];if(store('reviews',reviews)){toast('Ta note est sauvegardée localement.');S.reviewStars=0;render()}}else if(e.target.id==='contribution-form'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));submissions.unshift({id:makeId(),...d,date:new Date().toISOString()});if(store('submissions',submissions)){toast('Suggestion enregistrée sur cet appareil.');render()}}});
window.addEventListener('hashchange',route);

route();

  </script>
  <script>
    // Enregistrer la PWA pour permettre l'installation et un mode hors ligne de base.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', {scope:'./'})
          .catch(function(error){console.warn('SoccerSpot : service worker non enregistré', error);});
      });
    }
  </script>
</body>
